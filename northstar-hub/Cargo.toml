[package]
name = "northstar-hub"
version = "0.1.0"
edition = "2021"
description = "Project NorthStar device manager: display layout, tracking bridges, native/WebXR launch and hot reload, from one local GUI"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusb = "0.9"
log = "0.4"
env_logger = "0.11"
