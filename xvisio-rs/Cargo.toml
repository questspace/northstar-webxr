[package]
name = "xvisio"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Rust SDK for XVisio XR50 6DOF tracking sensor"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }
rusb = "0.9"
thiserror = "2"
crossbeam-channel = "0.5"
log = "0.4"
bitflags = "2"
serde_json = "1"
rayon = "1"
rustc-hash = "2"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
env_logger = "0.11"
tungstenite = "0.24"
tiny_http = "0.12"

[features]
default = ["camera"]
# Stereo fisheye images over the standard UVC interface (Media Foundation / V4L2 / AVFoundation)
camera = ["dep:nokhwa"]

[[example]]
name = "fisheye"
required-features = ["camera"]

[[example]]
name = "depth"
required-features = ["camera"]

[[example]]
name = "stereo_diag"
required-features = ["camera"]

[[example]]
name = "reconstruct"
required-features = ["camera"]

[[example]]
name = "recon_record"
required-features = ["camera"]

[[example]]
name = "camera_modes"
required-features = ["camera"]

