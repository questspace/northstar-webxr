[package]
name = "northstar-native"
version = "0.1.0"
edition = "2021"
description = "Native pass-through XR pipeline for Project NorthStar (XR50 + Ultraleap + wgpu)"

[dependencies]
xvisio = { path = "../xvisio-rs" }
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
backtrace = "0.3"
tungstenite = "0.24"

[profile.release]
debug = 1
